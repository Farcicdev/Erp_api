spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:erp_db}
    username: ${POSTGRES_USER:erp}
    password: ${POSTGRES_PASSWORD:erp}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:${KEYCLOAK_PORT:8081}/realms/${KEYCLOAK_REALM:erp-realm}
